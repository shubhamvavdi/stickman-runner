<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Stickman Runner — endless runner game</title>
<meta name="description" content="Run, jump, slide and survive as long as possible in this fast-paced endless stickman runner." />
<meta name="theme-color" content="#0a0c18" />
<meta name="robots" content="index, follow" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Stickman Runner" />
<meta property="og:description" content="Run, jump, slide and survive as long as possible in this fast-paced endless stickman runner." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0a0c18;
    --sky: #151a33;
    --text: #f2f5ff;
    --mint: #6de3c0;
    --coin: #ffd166;
    --danger: #ff5d73;
    --panel: rgba(16, 20, 40, 0.92);
    --edge: rgba(242, 245, 255, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game-root {
    position: fixed;
    inset: 0;
    display: block;
  }

  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #ui-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px;
    background: radial-gradient(120% 90% at 50% 0%, rgba(74, 59, 107, 0.55), rgba(10, 12, 24, 0.86));
    pointer-events: auto;
  }
  .overlay[hidden] { display: none; }

  .panel {
    width: min(520px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: 28px 28px 24px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 18px;
    text-align: center;
    backdrop-filter: blur(6px);
  }

  .title {
    margin: 0;
    line-height: 0.92;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    flex-direction: column;
  }
  .title__stick { font-size: clamp(38px, 9vw, 58px); }
  .title__run {
    font-size: clamp(38px, 9vw, 58px);
    color: var(--mint);
  }

  .tagline {
    margin: 12px 0 4px;
    color: rgba(242, 245, 255, 0.72);
    font-size: 16px;
  }

  .best {
    margin: 0 0 20px;
    color: var(--coin);
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 18px;
  }

  .btn {
    font: inherit;
    font-weight: 600;
    font-size: 17px;
    padding: 13px 20px;
    color: var(--text);
    background: rgba(242, 245, 255, 0.07);
    border: 1px solid var(--edge);
    border-radius: 11px;
    cursor: pointer;
    transition: background 120ms ease, transform 120ms ease;
  }
  .btn:hover { background: rgba(242, 245, 255, 0.14); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

  .btn--primary {
    background: var(--mint);
    color: #06210f;
    border-color: transparent;
    font-size: 19px;
  }
  .btn--primary:hover { background: #86f0d1; }

  .btn--toggle { min-width: 92px; padding: 9px 16px; }
  .btn--toggle.is-off { color: rgba(242, 245, 255, 0.5); }

  .help { margin-top: 22px; text-align: left; }
  .help__title { margin: 0 0 10px; font-size: 20px; }
  .keys { margin: 0; display: grid; grid-template-columns: minmax(96px, 38%) 1fr; gap: 8px 14px; }
  .keys dt { font-weight: 600; color: var(--mint); font-size: 15px; }
  .keys dd { margin: 0; font-size: 15px; color: rgba(242, 245, 255, 0.78); }
  .help .btn { margin-top: 18px; width: 100%; }

  .panel__title { margin: 0 0 6px; font-size: 26px; font-weight: 600; }
  .panel__meta { margin: 0; color: rgba(242, 245, 255, 0.65); }

  .score-big {
    margin: 6px 0 2px;
    font-size: clamp(52px, 13vw, 76px);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--coin);
  }
  .record { margin: 0 0 18px; color: rgba(242, 245, 255, 0.7); font-size: 15px; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    padding: 12px 8px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    display: grid;
    gap: 4px;
  }
  .stat__label { font-size: 13px; color: rgba(242, 245, 255, 0.6); }
  .stat__value { font-size: 20px; font-weight: 600; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--edge);
  }
  .toggle-row__label { font-size: 16px; }

  /* Ad slot: sits below the panel, only takes space when an ad is rendered. */
  #gamehub-banner-ad {
    position: absolute;
    left: 50%;
    bottom: max(10px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(100%, 340px);
    display: none;
    z-index: 5;
    pointer-events: auto;
    border-radius: 12px;
    overflow: hidden;
  }
  #gamehub-banner-ad.is-active { display: block; }
  #gamehub-banner-ad:empty { display: none; }

  .btn--revive {
    background: rgba(255, 209, 102, 0.16);
    border-color: rgba(255, 209, 102, 0.5);
    color: var(--coin);
  }
  .btn--revive:hover { background: rgba(255, 209, 102, 0.26); }
  .btn--revive[disabled] { opacity: 0.55; cursor: default; }

  @media (max-width: 520px) {
    .panel { padding: 22px 18px 18px; border-radius: 14px; }
    .keys { grid-template-columns: 1fr; gap: 2px 0; }
    .keys dd { margin-bottom: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas" aria-label="Stickman Runner game" role="img"></canvas>
    <div id="ui-layer"></div>
    <div id="gamehub-banner-ad" aria-label="Advertisement"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
